global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'alma-scanner'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alma-scanner'
    static_configs:
      - targets: ['localhost:9002']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  - job_name: 'docker'
    static_configs:
      - targets: ['localhost:9323']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
