version: '3.8'

services:
  # Main Alma Scanner Application
  alma-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alma-scanner
    ports:
      - "9002:9002"
    environment:
      - PYTHONPATH=/app/backend
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=warning
      - API_HOST=0.0.0.0
      - API_PORT=9002
    volumes:
      # Mount these directories to persist data between runs
      - alma-data:/app/data
      - alma-cache:/app/data/cache
      - alma-models:/app/data/models
      - alma-reports:/app/data/reports
      - alma-telemetry:/app/data/telemetry
      # Optional: mount a local folder for scanning
      # - /usr/bin:/scan-targets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - alma-network

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: alma-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - alma-scanner
    restart: unless-stopped
    networks:
      - alma-network

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: alma-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - alma-scanner
    restart: unless-stopped
    networks:
      - alma-network

volumes:
  alma-data:
    driver: local
  alma-cache:
    driver: local
  alma-models:
    driver: local
  alma-reports:
    driver: local
  alma-telemetry:
    driver: local
  grafana-storage:
    driver: local
  prometheus-storage:
    driver: local

networks:
  alma-network:
    driver: bridge
